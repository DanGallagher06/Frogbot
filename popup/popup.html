<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Frogbot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../assets/icon.svg" alt="">
    <h1>Frogbot</h1>
  </header>
  <main class="main">
    <button id="release" type="button">Release the frog</button>
    <p id="shortcut" class="hint" hidden></p>
    <label class="option switch">
      <input id="use-ai" type="checkbox" role="switch">
      Use on-device AI
    </label>
    <p id="ai-note" class="note" hidden>On-device AI isn't available on this computer - Frogbot uses its built-in summary.</p>
    <p id="message" class="message" hidden></p>
  </main>
  <footer class="foot">
    <a id="help" href="#">Help</a>
    <a id="report" href="#">Report a problem</a>
    <span id="version" class="version"></span>
  </footer>
  <script src="../shared/release.js"></script>
  <script src="popup.js"></script>
</body>
</html>
